# Kira job for a "user-defined system": the integration-by-parts identities
# are not generated by Kira from propagators but written by step 3
# (equations.kira), one block per identity, each line "integral*(coefficient)".
# Integrals are plain integers; Kira orders them by size, so the unreduced
# integrals get the large labels (100, 200) and the finite masters the small
# ones (1, 2, 3).  Results appear in results/Tuserweight/kira_targets.m as
# Tuserweight[label].
jobs:
  - reduce_user_defined_system:
      input_system:
        files: [equations.kira]
        config: false
      select_integrals:
        select_mandatory_list:
          - [targets]
      run_initiate: true
      run_triangular: true
      run_back_substitution: true
  - kira2math:
      target:
        - [targets]
